services:
  - type: web
    name: towercrm-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node backend/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: towercrm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
    healthCheckPath: /health

  - type: web
    name: towercrm-frontend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: nginx -g "daemon off;"
    envVars:
      - key: BACKEND_URL
        value: https://towercrm-backend.onrender.com

databases:
  - name: towercrm-db
    databaseName: towercrm
    user: towercrm
