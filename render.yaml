services:
  - type: web
    name: towercrm-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npx prisma generate --schema=backend/prisma/schema.prisma && npm run build:all
    startCommand: cd backend && npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: towercrm-db
          property: connectionString

databases:
  - name: towercrm-db
    databaseName: towercrm
    user: towercrm
    plan: free
    region: frankfurt
