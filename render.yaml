services:
  - type: web
    name: towercrm-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: towercrm-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://towercrm-frontend.onrender.com

  - type: web
    name: towercrm-frontend
    env: static
    region: frankfurt
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_WS_URL
        value: https://towercrm-backend.onrender.com/ws
    routes:
      - type: rewrite
        source: /api/*
        destination: https://towercrm-backend.onrender.com/api/:splat
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

databases:
  - name: towercrm-db
    databaseName: towercrm
    user: towercrm
    plan: free
    region: frankfurt
